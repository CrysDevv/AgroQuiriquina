<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f8b7d">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/static/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>.tr[data-a]{cursor:pointer}@media(max-width:899px){.side nav{overflow-x:auto}.side nav a{flex:1 0 62px}}</style>
  <title>AgroQuiriquina</title>
</head>
<body>
  <div id="app"></div>
  <div id="toast"></div>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(Number(n)||0);
const ls={get(k,d){try{const v=localStorage.getItem('aq_'+k);return v?JSON.parse(v):d}catch(e){return d}},
set(k,v){try{localStorage.setItem('aq_'+k,JSON.stringify(v))}catch(e){toast('<i class="bi bi-exclamation-triangle"></i> Almacenamiento lleno')}},del(k){try{localStorage.removeItem('aq_'+k)}catch(e){}}};
const uuid=()=>{const b=crypto.getRandomValues(new Uint8Array(16));b[6]=b[6]&15|64;b[8]=b[8]&63|128;const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');return`${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`};
const rutOk=r=>{r=r.replace(/[.\-\s]/g,'').toUpperCase();if(!/^\d{6,8}[\dK]$/.test(r))return false;let s=0,m=2;for(const d of r.slice(0,-1).split('').reverse()){s+=d*m;m=m==7?2:m+1}const x=11-s%11;return r.slice(-1)===(x==11?'0':x==10?'K':String(x))};
const rutFmt=r=>{r=r.replace(/[.\-\s]/g,'').toUpperCase();return r.slice(0,-1)+'-'+r.slice(-1)};
const S={tok:ls.get('tok'),me:ls.get('me'),cat:ls.get('cat',{clientes:[],productos:[],trabajadores:[]}),q:ls.get('q',{clientes:[],ventas:[],desempenos:[]}),
  last:ls.get('last'),catTime:ls.get('catTime',null),ventas:ls.get('ventas',[]),hist:ls.get('hist',[]),ins:ls.get('ins',[]),errs:ls.get('errs',{}),online:navigator.onLine};
const save=()=>{['cat','q','ventas','hist','ins','errs'].forEach(k=>ls.set(k,S[k]));ls.set('last',S.last);ls.set('catTime',S.catTime||null)};
const pend=()=>S.q.clientes.length+S.q.ventas.length+S.q.desempenos.length;
const MENU=[['inicio','<i class="bi bi-house"></i>','Inicio'],['ventas','<i class="bi bi-receipt"></i>','Ventas',['ADMIN','VENDEDOR']],['despachos','<i class="bi bi-truck"></i>','Despachos',['ADMIN','VENDEDOR']],['clientes','<i class="bi bi-people"></i>','Clientes',['ADMIN','VENDEDOR']],['inventario','<i class="bi bi-box-seam"></i>','Bodega'],
  ['terreno','<i class="bi bi-tree"></i>','Terreno',['ADMIN','SUPERVISOR']],['equipo','<i class="bi bi-person-badge"></i>','Equipo',['ADMIN','SUPERVISOR']],['finanzas','<i class="bi bi-cash-coin"></i>','Finanzas',['ADMIN']],['nomina','<i class="bi bi-person-lines-fill"></i>','Nómina',['ADMIN']]];
const can=id=>{const m=MENU.find(x=>x[0]===id);return m&&(!m[3]||m[3].includes(S.me.rol))};
const main=h=>{$('main').innerHTML=h};
const toast=t=>{const e=$('#toast');e.innerHTML=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3500)};
const er=e=>toast('<i class="bi bi-exclamation-triangle"></i> '+esc(e.message));
const nok=m=>toast('<i class="bi bi-check-circle"></i> '+m);
const opts=(a,f)=>a.map(x=>`<option value="${esc(x.id)}">${esc(f(x))}</option>`).join('');
const cn=id=>(S.cat.clientes.find(c=>c.id===id)||{}).nombre||'Cliente';
const tn=id=>(S.cat.trabajadores.find(c=>c.id===id)||{}).nombre||'Trabajador';
const pn=id=>(S.cat.productos.find(c=>c.id===id)||{}).nombre||'Producto';
const inm=id=>(S.cat.productos.find(x=>x.id===id)||S.ins.find(x=>x.id===id)||{}).nombre||'Ítem';
const fdt=d=>d?new Date(d).toLocaleString('es-CL',{dateStyle:'medium',timeStyle:'short'}):'';
const offMsg=e=>e.status?esc(e.message):'<i class="bi bi-wifi-off"></i> Esta pantalla necesita conexión a internet.';
const devId=()=>ls.get('dev')||(ls.set('dev',uuid().slice(0,8)),ls.get('dev'));
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const lock=f=>async d=>{if(lock.b)return;lock.b=1;try{await f(d)}finally{lock.b=0}};
const fi=(id,l,v,t='text',x='')=>`<label>${l}</label><input id="${id}" type="${t}" value="${esc(v??'')}" ${x}>`;
const fs=(id,l,o,v)=>`<label>${l}</label><select id="${id}">${o.map(x=>`<option value="${esc(x[0])}"${String(x[0])===String(v??'')?' selected':''}>${esc(x[1])}</option>`).join('')}</select>`;
const fc=(id,l,v)=>`<label><input id="${id}" type="checkbox" style="width:auto"${v?' checked':''}> ${l}</label>`;

async function api(path,o={},retry=true){
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),12000);
  try{const r=await fetch('/api/v1'+path,{...o,signal:ac.signal,headers:{'Content-Type':'application/json',...(S.tok?{Authorization:'Bearer '+S.tok.access}:{})},body:o.body&&JSON.stringify(o.body)});
    if(r.status===401&&retry&&S.tok?.refresh){const rr=await fetch('/api/v1/auth/token/refresh/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh:S.tok.refresh})});
      if(rr.ok){S.tok.access=(await rr.json()).access;ls.set('tok',S.tok);return api(path,o,false)}logout(true);throw new Error('Sesión vencida')}
    const d=await r.json().catch(()=>null);
    if(!r.ok){const e=new Error(r.status===403?'Sin permiso para esto':d?JSON.stringify(d):'Error '+r.status);e.status=r.status;throw e}
    return d}finally{clearTimeout(tm)}}

async function sync(show){
  if(S.busy||!S.tok)return;S.busy=1;stat();
  try{
  for(const k of['clientes','ventas','desempenos']){
    const items=S.q[k].slice(0,500);if(!items.length)continue;
    const d=await api(`/sync/${k}/bulk/`,{method:'POST',body:{[k]:items}});
    const ok=new Set(d.resultados.filter(r=>r.status!=='error').map(r=>r.id));
    d.resultados.filter(r=>r.status==='error').forEach(r=>{S.errs[r.id]=k+': '+Object.entries(r.errors||{}).map(([a,b])=>a+' '+JSON.stringify(b)).join('; ')});
    ok.forEach(id=>delete S.errs[id]);S.q[k]=S.q[k].filter(i=>!ok.has(i.id))}
  const c=await api('/sync/catalogo/'+(S.catTime?`?updated_since=${encodeURIComponent(S.catTime)}`:''));
  for(const k of['clientes','productos','trabajadores'])if(c[k]){
    const base=S.catTime?S.cat[k]:(k==='clientes'?S.q.clientes:[]),m=new Map(base.map(x=>[x.id,x]));
    c[k].forEach(x=>x.is_deleted?m.delete(x.id):m.set(x.id,x));S.cat[k]=[...m.values()]}
  if(c.server_time)S.catTime=c.server_time;
  S.last=Date.now();S.online=true;if(show)toast('<i class="bi bi-check-circle"></i> Sincronizado');
  }catch(e){if(e.name==='TypeError'||e.name==='AbortError'){S.online=false;if(show)toast('<i class="bi bi-wifi-off"></i> Sin conexión: se enviará más tarde')}else if(show)toast('<i class="bi bi-exclamation-triangle"></i> '+esc(e.message))}
  finally{S.busy=0;save();stat();if(['inicio','ventas','inventario'].includes(route())&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName||''))go()}}

const route=()=>location.hash.slice(2).split('/')[0]||'inicio';
const rarg=()=>location.hash.slice(2).split('/')[1]||'';
const stat=()=>{const e=$('#st');if(e)e.innerHTML=`${S.busy?'<i class="bi bi-hourglass-split"></i>':S.online?'<i class="bi bi-wifi" style="color:var(--ok)"></i>':'<i class="bi bi-wifi-off" style="color:var(--err)"></i>'} ${pend()?pend()+' pendiente(s)':S.online?'En línea':'Sin conexión'}`};
function logout(force){if(!force&&pend()&&!confirm('Hay datos sin enviar. Se conservarán en este teléfono. ¿Cerrar sesión?'))return;
  ls.del('tok');ls.del('me');S.tok=S.me=null;location.hash='';login()}

function login(msg){
  $('#app').innerHTML=`<main class="lg"><div class="card"><img src="/static/icons/logo.png" alt="AgroQuiriquina" style="display:block;width:100%;max-width:220px;height:auto;margin:0 auto 16px"><h2 style="margin:0 0 4px;text-align:center">Ingresar a mi Cuenta</h2>
  <label>Usuario</label><input id="u" autocapitalize="none" autocomplete="username"><label>Contraseña</label><input id="p" type="password" autocomplete="current-password">
  <button class="btn" id="go">Iniciar Sesión</button><p id="em" style="color:#c62828">${msg?esc(msg):''}</p></div></main>`;
  $('#go').onclick=async()=>{try{
  const r=await fetch('/api/v1/auth/token/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#u').value.trim(),password:$('#p').value})});
  if(!r.ok)throw new Error(r.status===401?'Usuario o clave incorrectos':'Error '+r.status);
  S.tok=await r.json();ls.set('tok',S.tok);S.me=await api('/me/');ls.set('me',S.me);S.catTime=null;ls.del('catTime');start()}catch(e){$('#em').innerHTML=e.name==='TypeError'?'<i class="bi bi-wifi-off"></i> Necesitas conexión para entrar la primera vez':esc(e.message)}}}

function start(){
  $('#app').innerHTML=`<div class="shell"><aside class="side"><div class="brand"><img src="/static/icons/logo.png" alt="" style="height:28px;vertical-align:middle"> AgroQuiriquina</div><nav>${MENU.filter(m=>can(m[0])).map(m=>`<a href="#/${m[0]}" data-n="${m[0]}"><b>${m[1]}</b><span>${m[2]}</span></a>`).join('')}</nav></aside>
  <div class="cont"><header class="top"><div id="crumb"></div><span id="st" data-a="sync" role="button" tabindex="0"></span><button class="btn sm sec" data-a="logout" style="margin:0">Salir</button></header><main></main></div></div>`;
  stat();go();sync(false)}

const ini=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const vtot=v=>v.detalles.reduce((s,d)=>s+d.cantidad*d.precio_unitario,0);
const BD={env:['<i class="bi bi-clock-history"></i> Por enviar',''],pag:['Pagada','ok'],par:['Abono',''],cob:['Por cobrar',''],anu:['Anulada','no']};
const allV=()=>{const q=new Set(S.q.ventas.map(v=>v.id));
  return[...S.q.ventas.slice().reverse().map(v=>({id:v.id,c:cn(v.cliente),f:v.fecha,t:vtot(v),e:'env'})),
  ...S.ventas.filter(v=>!q.has(v.id)).map(v=>({id:v.id,c:cn(v.cliente),f:v.fecha,t:Number(v.total),e:v.estado==='ANULADA'?'anu':v.estado_pago==='PAGADO'?'pag':v.estado_pago==='PARCIAL'?'par':'cob',r:v.requiere_revision}))]};
const vrow=v=>`<div class="tr" data-a="vd" data-id="${esc(v.id)}"><span class="who"><i class="av">${ini(v.c)}</i><span><b>${esc(v.c)}</b><small>${fdt(v.f)}</small></span></span>
  <span class="num">${money(v.t)}</span><span><span class="bd ${BD[v.e][1]}">${BD[v.e][0]}</span>${v.r?' <span class="bd no">Revisar stock</span>':''}</span></div>`;
const vhead='<div class="th"><span>Cliente</span><span>Total</span><span>Estado</span></div>';
const low=p=>Number(p.cantidad_disponible)<=Number(p.stock_minimo);
const ring=p=>`<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="${p}% del stock en buen nivel"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="10"/>
  <circle cx="60" cy="60" r="52" fill="none" stroke="var(--ac)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(3.267*p).toFixed(1)} 400" transform="rotate(-90 60 60)"/><text x="60" y="69" text-anchor="middle">${p}%</text></svg>`;

function go(){const r=route(),id=(r==='nueva-venta'||r==='venta')?'ventas':r,v=V[r]||V.inicio,lab={'nueva-venta':'Nueva venta',venta:'Detalle de venta'};
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.n===id));
  if(r!=='inicio'&&!can(id)){location.hash='#/inicio';return}
  $('#crumb').innerHTML='AgroQuiriquina / <b>'+(lab[r]||(MENU.find(m=>m[0]===id)||[])[2]||'Inicio')+'</b>';scrollTo(0,0);
  Promise.resolve().then(()=>v()).catch(e=>main(`<div class="card">${esc(e.message)}</div>`))}

const A={sync:()=>sync(true),fv:d=>{V.fl=d.f;V.ventas()},logout:()=>logout(),
  rm:d=>{L.splice(d.i,1);lines()},
  desc:()=>{Object.keys(S.errs).forEach(id=>['clientes','ventas','desempenos'].forEach(k=>S.q[k]=S.q[k].filter(i=>i.id!==id)));S.errs={};save();stat();go()},
  rem:async d=>{try{await api(`/remuneraciones/${d.id}/${d.op}/`,{method:'POST'});V.nomina()}catch(e){toast('<i class="bi bi-exclamation-triangle"></i> '+esc(e.message))}},
  exp:lock(async()=>{try{const r=await fetch('/api/v1/remuneraciones/exportar/',{headers:{Authorization:'Bearer '+S.tok.access}});
    if(!r.ok)throw new Error(r.status===403?'Sin permiso para esto':'Error '+r.status);
    const u=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=u;a.download='remuneraciones.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1e4)}catch(e){er(e)}}),
  // --- ventas / abonos
  vd:d=>{location.hash='#/venta/'+d.id},
  abonar:lock(async d=>{const m=Math.round(parseFloat($('#am').value)),mx=Math.round(parseFloat($('#am').max));
    if(!(m>0))return toast('<i class="bi bi-exclamation-triangle"></i> Indica un monto mayor que 0');
    if(m>mx)return toast('<i class="bi bi-exclamation-triangle"></i> El abono supera el saldo pendiente');
    try{await api('/pagos/',{method:'POST',body:{id:uuid(),venta:d.id,monto:m,metodo:$('#amt').value,estado:'PAGADO'}});nok('Abono registrado');V.t=0;await V.venta()}catch(e){er(e)}}),
  anular:lock(async d=>{if(!confirm('¿Anular esta venta? Se repondrá el stock y se anularán los pagos pendientes.'))return;
    try{await api(`/ventas/${d.id}/anular/`,{method:'POST'});nok('Venta anulada');V.t=0;rfProd();await V.venta()}catch(e){er(e)}}),
  revisar:lock(async d=>{try{await api(`/ventas/${d.id}/marcar-revisada/`,{method:'POST'});nok('Stock marcado como revisado');V.t=0;await V.venta()}catch(e){er(e)}}),
  cob:lock(async d=>{const e=document.getElementById('cv'+d.id);if(!e)return;e.innerHTML='<small>Cargando…</small>';
    try{const r=await api(`/ventas/?cliente=${d.id}&estado=CONFIRMADA&limit=200`),Lv=r.results.filter(v=>Number(v.saldo_pendiente)>0);
      e.innerHTML=Lv.map(v=>`<div class="li"><span><small>${fdt(v.fecha)}</small><br>Saldo <b>${money(v.saldo_pendiente)}</b></span><a class="btn sm" href="#/venta/${v.id}">Abonar</a></div>`).join('')||'<small>Sin ventas con saldo pendiente</small>'}
    catch(x){e.innerHTML='';er(x)}}),
  // --- despachos
  dfl:d=>{V.dfl=d.f;V.despachos(true)},
  dsv:lock(async d=>{const g=s=>$('#'+s+d.id).value.trim();
    try{const r=await api(`/despachos/${d.id}/`,{method:'PATCH',body:{estado:$('#de'+d.id).value,transportista:g('dt'),patente:g('dp'),observaciones:g('do')}});
      const i=V.dl.findIndex(x=>x.id===d.id);if(i>=0)V.dl[i]=r;nok('Despacho actualizado');V.despachos(true)}catch(e){er(e)}}),
  // --- bodega
  npr:lock(async()=>{const v=id=>$('#'+id).value.trim();if(!v('pr_n'))return toast('<i class="bi bi-exclamation-triangle"></i> Falta el nombre');
    try{await api('/productos/',{method:'POST',body:{nombre:v('pr_n'),categoria:$('#pr_c').value,variedad:v('pr_v'),unidad_medida:$('#pr_u').value,stock_minimo:String(parseFloat($('#pr_m').value)||0),precio_referencia:Math.round(parseFloat($('#pr_p').value)||0),peso_saco_kg:v('pr_k')||null}});
      nok('Producto creado. Carga su stock con una ENTRADA.');await invRefresh(1)}catch(e){er(e)}}),
  nin:lock(async()=>{const v=id=>$('#'+id).value.trim();if(!v('in_n'))return toast('<i class="bi bi-exclamation-triangle"></i> Falta el nombre');
    try{await api('/insumos/',{method:'POST',body:{nombre:v('in_n'),tipo:$('#in_t').value,unidad_medida:$('#in_u').value,stock_minimo:String(parseFloat($('#in_m').value)||0),dosis_por_hectarea:String(parseFloat($('#in_d').value)||0)}});
      nok('Insumo creado. Carga su stock con una ENTRADA.');await invRefresh(1)}catch(e){er(e)}}),
  mov:lock(async()=>{const k=$('#mk').value,id=$('#mi').value,t=$('#mt').value,q=parseFloat($('#mq').value);
    if(!id)return toast('<i class="bi bi-exclamation-triangle"></i> Elige un ítem');
    if(!(q>=0)||(t!=='AJUSTE'&&!(q>0)))return toast('<i class="bi bi-exclamation-triangle"></i> Indica una cantidad válida');
    try{await api(`/${k}/${id}/movimiento/`,{method:'POST',body:{tipo:t,cantidad:String(q),motivo:$('#mo').value.trim()}});nok('Movimiento registrado');await invRefresh(1)}catch(e){er(e)}}),
  // --- equipo
  eqt:d=>{V.et=d.t;V.eo=0;V.equipo()},
  eqn:()=>{V.ee=null;V.eo=1;V.equipo(true)},
  eqc:()=>{V.ee=null;V.eo=0;V.equipo(true)},
  eqe:d=>{V.ee=V.eq[V.et].find(x=>String(x.id)===d.id)||null;V.eo=1;V.equipo(true);scrollTo(0,0)},
  eqs:lock(async()=>{const tab=V.et,ed=V.ee,v=id=>$('#'+id).value.trim();let b;
    if(tab==='t'||tab==='p'){
      if(!v('nm'))return toast('<i class="bi bi-exclamation-triangle"></i> Falta el nombre');
      if(!rutOk(v('ru')))return toast('<i class="bi bi-exclamation-triangle"></i> RUT inválido, revísalo');
      b={rut:rutFmt(v('ru')),nombre:v('nm')};
      if(tab==='t')Object.assign(b,{tipo_contrato:$('#tc').value,cargo:v('cg'),tarifa_diaria:Math.round(parseFloat($('#tf').value)||0),activo:$('#ac').checked});
      else Object.assign(b,{rubro:v('rb'),telefono:v('tl'),condiciones_pago:v('cp')})}
    else{
      if(!v('un'))return toast('<i class="bi bi-exclamation-triangle"></i> Falta el nombre de usuario');
      if(!ed&&$('#pw').value.length<8)return toast('<i class="bi bi-exclamation-triangle"></i> La contraseña debe tener al menos 8 caracteres');
      b={username:v('un'),first_name:v('fn'),last_name:v('ln'),rol:$('#rl').value,persona:$('#ps').value||null,is_active:$('#ac').checked};
      if($('#pw').value)b.password=$('#pw').value}
    try{await api(EQ[tab][0]+(ed?ed.id+'/':''),{method:ed?'PATCH':'POST',body:b});nok('Guardado');V.eo=0;V.equipo()}catch(e){er(e)}})};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t)A[t.dataset.a]?.(t.dataset)});
addEventListener('hashchange',()=>S.me&&go());
addEventListener('online',()=>{S.online=true;stat();sync(false)});addEventListener('offline',()=>{S.online=false;stat()});
setInterval(()=>{if(S.tok&&pend()&&navigator.onLine)sync(false)},60000);
const rfProd=async()=>{try{const d=await api('/productos/?limit=500');S.cat.productos=d.results;save()}catch(e){}};

const V={};
V.inicio=()=>{const n=Object.keys(S.errs).length,P=S.cat.productos,bajos=P.filter(low).length,pct=P.length?Math.round(100*(P.length-bajos)/P.length):100,
  V_=allV(),hoy=V_.filter(v=>v.e!=='anu'&&String(v.f).slice(0,10)===today()).reduce((s,v)=>s+v.t,0),cob=V_.filter(v=>v.e==='cob'||v.e==='par').length,
  acts=[['nueva-venta','<i class="bi bi-receipt"></i>','Nueva venta','ventas',150],['terreno','<i class="bi bi-tree"></i>','Registrar trabajo','terreno',130],['inventario','<i class="bi bi-box-seam"></i>','Ver stock','inventario',35],['clientes','<i class="bi bi-people"></i>','Clientes','clientes',210],['finanzas','<i class="bi bi-cash-coin"></i>','Por cobrar','finanzas',45],['nomina','<i class="bi bi-person-lines-fill"></i>','Nómina','nomina',270]].filter(a=>can(a[3])),
  kp=[[can('ventas')&&['Vendido hoy',money(hoy)],can('ventas')&&['Ventas por cobrar',cob],['Por enviar',pend()],['Productos con stock bajo',bajos]]].flat().filter(Boolean);
  main(`${n?`<div class="card"><h2><i class="bi bi-exclamation-triangle"></i> ${n} registro(s) con error</h2>${Object.values(S.errs).slice(0,3).map(e=>`<p><small>${esc(e)}</small></p>`).join('')}<button class="btn red sm" data-a="desc">Descartar los que tienen error</button></div>`:''}

V.ventas=()=>{const f=V.fl||'todas',q=(V.q||'').toLowerCase(),F={todas:()=>1,cobrar:v=>v.e==='cob'||v.e==='par',enviar:v=>v.e==='env'},

  <div class="chips">${[['todas','Todas'],['cobrar','Por cobrar'],['enviar','Por enviar']].map(c=>`<button class="chip ${f===c[0]?'on':''}" data-a="fv" data-f="${c[0]}">${c[1]}</button>`).join('')}</div>
  <input id="bq" placeholder="Buscar por cliente" value="${esc(V.q||'')}" style="margin-bottom:12px">${vhead}${L_.map(vrow).join('')||'<p><small>No hay ventas con este filtro.</small></p>'}</div>`);
  $('#bq').oninput=e=>{V.q=e.target.value;const p=e.target.selectionStart;V.ventas();$('#bq').focus();$('#bq').setSelectionRange(p,p)};

V.venta=async()=>{const id=rarg(),back='<a class="btn sm sec" href="#/ventas"><i class="bi bi-arrow-left"></i> Volver</a>',pq=S.q.ventas.find(x=>x.id===id);
  if(pq)return main(`<div class="card">${back}<h2 style="margin-top:12px">${esc(cn(pq.cliente))}</h2><small>${fdt(pq.fecha)}</small><p><span class="bd">${BD.env[0]}</span></p>
    ${pq.detalles.map(d=>`<div class="li"><span>${esc(pn(d.producto))}<br><small>${Number(d.cantidad)} × ${money(d.precio_unitario)}</small></span><b>${money(d.cantidad*d.precio_unitario)}</b></div>`).join('')}
    <p class="tot">${money(vtot(pq))}</p><small>Podrás abonar o anular cuando la venta se haya sincronizado.</small></div>`);
  main('<div class="card">Cargando…</div>');
  let v;try{v=await api('/ventas/'+id+'/')}catch(e){v=S.ventas.find(x=>x.id===id);if(!v)return main(`<div class="card">${back}<p>${offMsg(e)}</p></div>`)}
  if(route()!=='venta'||rarg()!==id)return;
  const i=S.ventas.findIndex(x=>x.id===id);if(i>=0){S.ventas[i]=v;save()}
  const adm=S.me.rol==='ADMIN',sp=Number(v.saldo_pendiente),anul=v.estado==='ANULADA',pag=Number(v.total)-sp,d=v.despacho,
  eb=anul?['Anulada','no']:v.estado_pago==='PAGADO'?['Pagada','ok']:v.estado_pago==='PARCIAL'?['Abono','']:['Por cobrar',''],
  acc=(v.estado==='CONFIRMADA'?`<button class="btn red" data-a="anular" data-id="${v.id}"><i class="bi bi-x-octagon"></i> Anular venta</button>`:'')+(adm&&v.requiere_revision===true?`<button class="btn sec" data-a="revisar" data-id="${v.id}"><i class="bi bi-check2-square"></i> Marcar stock revisado</button>`:'');
  main(`<div class="card">${back}<div class="ph" style="margin-top:12px"><div><h2>${esc(cn(v.cliente))}</h2><small>${fdt(v.fecha)}</small></div><span><span class="bd ${eb[1]}">${eb[0]}</span>${v.requiere_revision?' <span class="bd no">Revisar stock</span>':''}</span></div>
    <h2 style="margin-top:14px">Productos</h2>${v.detalles.map(x=>`<div class="li"><span>${esc(pn(x.producto))}<br><small>${Number(x.cantidad)} × ${money(x.precio_unitario)}</small></span><b>${money(x.subtotal)}</b></div>`).join('')}
    <p class="tot">${money(v.total)}</p></div>
  <div class="card"><h2>Pagos</h2>${v.pagos.map(p=>`<div class="li"><span>${esc(p.metodo)}<br><small>${p.fecha_pago?fdt(p.fecha_pago):p.fecha_vencimiento?'Vence '+esc(p.fecha_vencimiento):''}</small></span><span style="text-align:right"><b>${money(p.monto)}</b><br><span class="bd ${p.estado==='PAGADO'?'ok':p.estado==='ANULADO'?'no':''}">${esc(p.estado)}</span></span></div>`).join('')||'<small>Sin pagos registrados</small>'}
    <div class="li"><span>Pagado</span><b>${money(pag)}</b></div><div class="li"><span>Saldo pendiente</span><b>${money(sp)}</b></div></div>
  ${d?`<div class="card"><h2>Despacho</h2><div class="li"><span>${esc(d.fecha)} ${esc(d.hora||'')}<br><small>${esc(d.direccion)} ${esc(d.comuna||'')}</small>${d.transportista||d.patente?`<br><small>${esc(d.transportista)} ${esc(d.patente)}</small>`:''}</span><span class="bd ${d.estado==='ENTREGADO'?'ok':d.estado==='CANCELADO'?'no':''}">${esc(d.estado)}</span></div>${can('despachos')?'<a class="btn sm sec" href="#/despachos">Gestionar despachos</a>':''}</div>`:''}
  ${sp>0&&!anul?`<div class="card"><h2>Registrar abono</h2><label>Monto ($)</label><input id="am" type="number" inputmode="numeric" value="${Math.round(sp)}" max="${Math.round(sp)}" min="1">
    <label>Método</label><select id="amt"><option value="EFECTIVO">Efectivo</option><option value="TRANSFERENCIA">Transferencia</option><option value="CHEQUE">Cheque</option></select>
    <button class="btn" data-a="abonar" data-id="${v.id}"><i class="bi bi-cash-coin"></i> Registrar abono</button></div>`:''}
  ${acc?`<div class="card">${acc}</div>`:''}`)};

let L=[];
const lines=()=>{const t=L.reduce((s,l)=>s+l.cantidad*l.precio_unitario,0);
  $('#lines').innerHTML=L.length?L.map((l,i)=>`<div class="li"><span>${esc(l.nombre)}<br><small>${l.cantidad} × ${money(l.precio_unitario)}</small></span><span><b>${money(l.cantidad*l.precio_unitario)}</b> <button class="btn sm red" data-a="rm" data-i="${i}"><i class="bi bi-x-lg"></i></button></span></div>`).join('')+`<p class="tot">Total: ${money(t)}</p>`:'<small>Agrega al menos un producto</small>'};

  main(`<div class="card"><h2>Nueva venta</h2><label>Cliente</label><select id="cl">${opts(C,c=>c.nombre)}</select><small><a href="#/clientes">¿Cliente nuevo? Créalo aquí</a></small>
  <label>Producto</label><select id="pr">${opts(P,p=>`${p.nombre} (${Number(p.cantidad_disponible)} ${p.unidad_medida})`)}</select>
  <div class="row"><div><label>Cantidad</label><input id="qt" type="number" inputmode="decimal" min="0" step="any"></div><div><label>Precio c/u</label><input id="pu" type="number" inputmode="numeric"></div></div>
  <button class="btn sec" id="add"><i class="bi bi-plus-lg"></i> Agregar producto</button></div>
  <div class="card" id="lines"></div>
  <div class="card"><label>Forma de pago</label><select id="pg"><option value="P">Pagado ahora</option><option value="C">A crédito (queda por cobrar)</option></select>

  $('#ok').onclick=()=>{const cl=$('#cl').value;if(!cl)return toast('<i class="bi bi-exclamation-triangle"></i> Elige un cliente');if(!L.length)return toast('<i class="bi bi-exclamation-triangle"></i> Agrega productos');

const ESD=['PROGRAMADO','EN_RUTA','ENTREGADO','CANCELADO'],BDD={PROGRAMADO:'',EN_RUTA:'',ENTREGADO:'ok',CANCELADO:'no'};
V.despachos=async keep=>{
  if(!keep||!V.dl){main('<div class="card">Cargando…</div>');
    try{const[d,vv]=await Promise.all([api('/despachos/?limit=200'),api('/ventas/?limit=200').catch(()=>({results:[]}))]);
      V.dl=d.results;V.dv=Object.fromEntries(vv.results.map(v=>[v.id,v]))}
    catch(e){return main(`<div class="card">${offMsg(e)}</div>`)}}

    ${fs('de'+d.id,'Estado',ESD.map(s=>[s,s]),d.estado)}${fi('dt'+d.id,'Transportista',d.transportista)}${fi('dp'+d.id,'Patente',d.patente,'text','maxlength="10"')}${fi('do'+d.id,'Observaciones',d.observaciones)}
    <button class="btn" data-a="dsv" data-id="${d.id}"><i class="bi bi-check2-circle"></i> Guardar cambios</button><a class="btn sm sec" href="#/venta/${d.venta}">Ver venta</a></details>`}).join('')}`)};

    <div class="row"><div>${fi('in_m','Stock mínimo','0','number','inputmode="decimal" step="any"')}</div><div>${fi('in_d','Dosis por hectárea','0','number','inputmode="decimal" step="any"')}</div></div>
    <button class="btn" data-a="nin"><i class="bi bi-check2-circle"></i> Guardar insumo</button></details>
  <details class="card"><summary><b><i class="bi bi-arrow-left-right"></i> Registrar movimiento de stock</b></summary>${fs('mk','Tipo de ítem',[['productos','Producto'],['insumos','Insumo']],'productos')}
    <label>Ítem</label><select id="mi">${opts(S.cat.productos,nm)}</select>${fs('mt','Movimiento',[['ENTRADA','Entrada'],['SALIDA','Salida'],['AJUSTE','Ajuste (nuevo stock total)']],'ENTRADA')}

  <div class="row"><div><label>Cantidad</label><input id="ct" type="number" inputmode="decimal" step="any"></div><div><label>Unidad</label><select id="un"><option value="SACO">Sacos</option><option value="KG">Kilos</option><option value="JORNADA">Jornadas</option></select></div></div>
  <label>Pago por unidad ($)</label><input id="tf" type="number" inputmode="numeric" placeholder="Vacío = tarifa diaria del trabajador"><label>Fecha</label><input id="fe" type="date" value="${today()}">
  <button class="btn" id="ok"><i class="bi bi-check2-circle"></i> Guardar registro</button></div>
  <div class="card"><h2>Últimos registros</h2>${S.hist.map(h=>`<div class="li"><span>${esc(h.n)}<br><small>${esc(h.l)} · ${h.c} ${esc(h.u)} · ${h.f}</small></span>${S.q.desempenos.some(q=>q.id===h.id)?'<span class="bd"><i class="bi bi-clock-history"></i> por enviar</span>':'<span class="bd ok"><i class="bi bi-check2"></i></span>'}</div>`).join('')||'<small>Sin registros</small>'}</div>`);
  $('#lb').onchange=e=>$('#un').value=T[e.target.value][1];$('#un').value=T.COSECHA_PAPA[1];
  $('#ok').onclick=()=>{const tr=$('#tr').value,c=parseFloat($('#ct').value);if(!tr)return toast('<i class="bi bi-exclamation-triangle"></i> Elige un trabajador');if(!(c>0))return toast('<i class="bi bi-exclamation-triangle"></i> Indica la cantidad');
    const d={id:uuid(),trabajador:tr,fecha:$('#fe').value,labor:$('#lb').value,cantidad:String(c),unidad:$('#un').value,device_id:devId()};
    if($('#tf').value)d.tarifa_unitaria=String(parseFloat($('#tf').value));
    S.q.desempenos.push(d);S.hist=[{id:d.id,n:tn(tr),l:T[d.labor][0],c,u:d.unidad,f:d.fecha},...S.hist].slice(0,15);save();stat();
    toast('<i class="bi bi-check-circle"></i> Registro guardado');V.terreno();sync(false)}};

// ------------------------------------------------------------------ Equipo
const EQ={t:['/trabajadores/','Trabajadores'],p:['/proveedores/','Proveedores'],u:['/usuarios/','Usuarios']};
V.equipo=async keep=>{
  const adm=S.me.rol==='ADMIN',tabs=adm?['t','p','u']:['t'];if(!tabs.includes(V.et))V.et='t';const tab=V.et;
  if(!keep||!V.eq||!V.eq[tab]){V.ee=null;V.eq=V.eq||{};main('<div class="card">Cargando…</div>');
    try{V.eq[tab]=(await api(EQ[tab][0]+'?limit=300')).results;if(tab==='u')V.eq.t=(await api('/trabajadores/?limit=300')).results}
    catch(e){return main(`<div class="card">${offMsg(e)}</div>`)}}
  if(route()!=='equipo')return;
  const Le=V.eq[tab],ed=!!V.ee,e=V.ee||{};let form,rows;
  if(tab==='t'){
    form=`${fi('ru','RUT',e.rut,'text','placeholder="12.345.678-5"')}${fi('nm','Nombre',e.nombre)}${fs('tc','Tipo de contrato',[['TEMPORERO','Temporero'],['PLAZO_FIJO','Plazo fijo'],['INDEFINIDO','Indefinido']],e.tipo_contrato||'TEMPORERO')}${fi('cg','Cargo',e.cargo)}${fi('tf','Tarifa diaria ($)',e.tarifa_diaria!=null?Math.round(e.tarifa_diaria):0,'number','inputmode="numeric"')}${fc('ac','Activo',ed?e.activo:true)}`;
    rows=x=>`<span class="who"><i class="av">${ini(x.nombre)}</i><span><b>${esc(x.nombre)}</b><br><small>${esc(x.rut)} · ${esc(x.cargo||'Sin cargo')} · ${esc(x.tipo_contrato)} · ${money(x.tarifa_diaria)}/día</small></span></span><span>${x.activo?'':'<span class="bd no">Inactivo</span> '}`}
  else if(tab==='p'){
    form=`${fi('ru','RUT',e.rut,'text','placeholder="76.123.456-7"')}${fi('nm','Nombre',e.nombre)}${fi('rb','Rubro',e.rubro)}${fi('tl','Teléfono',e.telefono,'tel')}${fi('cp','Condiciones de pago',e.condiciones_pago)}`;
    rows=x=>`<span class="who"><i class="av">${ini(x.nombre)}</i><span><b>${esc(x.nombre)}</b><br><small>${esc(x.rut)} · ${esc(x.rubro||'Sin rubro')} ${esc(x.telefono||'')}</small></span></span><span>`}
  else{
    form=`${fi('un','Usuario',e.username,'text','autocapitalize="none"')}${fi('fn','Nombre',e.first_name)}${fi('ln','Apellido',e.last_name)}${fs('rl','Rol',[['ADMIN','Administrador'],['VENDEDOR','Vendedor'],['SUPERVISOR','Supervisor de Terreno']],e.rol||'VENDEDOR')}
    ${fs('ps','Trabajador vinculado',[['','— Sin vincular —'],...(V.eq.t||[]).map(t=>[t.id,t.nombre])],e.persona||'')}${fi('pw','Contraseña'+(ed?' (vacía = no cambiar)':' (mínimo 8 caracteres)'),'','password','autocomplete="new-password"')}${fc('ac','Activo',ed?e.is_active:true)}`;
    rows=x=>`<span class="who"><i class="av">${ini(x.first_name||x.username)}</i><span><b>${esc(x.username)}</b><br><small>${esc((x.first_name+' '+x.last_name).trim()||'Sin nombre')} · ${esc(x.rol)}</small></span></span><span>${x.is_active?'':'<span class="bd no">Inactivo</span> '}`}
  main(`<div class="card"><div class="ph"><div><h2>Equipo y contactos</h2><small>${Le.length} registro(s)</small></div><button class="btn sm" data-a="eqn"><i class="bi bi-plus-lg"></i> Nuevo</button></div>
    ${tabs.length>1?`<div class="chips">${tabs.map(k=>`<button class="chip ${tab===k?'on':''}" data-a="eqt" data-t="${k}">${EQ[k][1]}</button>`).join('')}</div>`:''}</div>
  <details class="card" ${V.eo?'open':''}><summary><b>${ed?'Editar':'Nuevo'} — ${EQ[tab][1]}</b></summary>${form}<button class="btn" data-a="eqs"><i class="bi bi-check2-circle"></i> Guardar</button>${V.eo?'<button class="btn sec" data-a="eqc">Cancelar</button>':''}</details>
  <div class="card"><h2>${EQ[tab][1]}</h2>${Le.map(x=>`<div class="li">${rows(x)}<button class="btn sm sec" data-a="eqe" data-id="${x.id}">Editar</button></span></div>`).join('')||'<small>Sin registros</small>'}</div>`)};

V.finanzas=async()=>{main('<div class="card">Cargando…</div>');
  try{const[a,b]=await Promise.all([api('/finanzas/cuentas-por-cobrar/'),api('/finanzas/rentabilidad/')]);
    main(`<div class="card"><h2>Resumen del mes</h2><div class="li"><span>Ventas</span><b>${money(b.ventas_totales)}</b></div><div class="li"><span>Cobrado</span><b>${money(b.cobrado)}</b></div>
    <div class="li"><span>Por cobrar</span><b>${money(b.por_cobrar)}</b></div><div class="li"><span>Nómina</span><b>${money(b.costo_nomina)}</b></div><div class="li"><span>Margen estimado</span><b>${money(b.margen_estimado)}</b></div><small>${esc(b.nota)}</small></div>
    <div class="card"><h2>Cuentas por cobrar: ${money(a.total_por_cobrar)}</h2>${a.clientes.map(c=>`<div class="li" style="flex-wrap:wrap"><span>${esc(c.nombre)}<br><small>${c.ventas} venta(s)</small></span><span><b>${money(c.deuda)}</b> <button class="btn sm" data-a="cob" data-id="${esc(c.cliente)}"><i class="bi bi-cash-coin"></i> Abonar</button></span><div id="cv${esc(c.cliente)}" style="flex:0 0 100%"></div></div>`).join('')||'<p>Nadie te debe.</p>'}</div>`)
  }catch(e){main(`<div class="card">${offMsg(e)}</div>`)}};

V.nomina=async()=>{main('<div class="card">Cargando…</div>');
  try{const d=await api('/remuneraciones/?limit=30'),mes=today().slice(0,8);
    main(`<details class="card"><summary><b><i class="bi bi-calculator"></i> Calcular pago de un trabajador</b></summary><label>Trabajador</label><select id="tr">${opts(S.cat.trabajadores,t=>t.nombre)}</select>
    <div class="row"><div><label>Desde</label><input id="d1" type="date" value="${mes}01"></div><div><label>Hasta</label><input id="d2" type="date" value="${today()}"></div></div>
    <div class="row"><div><label>Bonos ($)</label><input id="bo" type="number" value="0"></div><div><label>Descuentos ($)</label><input id="de" type="number" value="0"></div></div>
    <button class="btn" id="ok">Calcular</button></details>
    <div class="card"><div class="ph"><h2>Remuneraciones</h2><button class="btn sm sec" data-a="exp"><i class="bi bi-download"></i> Exportar CSV</button></div>${d.results.map(r=>`<div class="li"><span>${esc(tn(r.trabajador))}<br><small>${r.periodo_inicio} → ${r.periodo_fin}</small><br>
    ${r.estado==='BORRADOR'?`<button class="btn sm" data-a="rem" data-id="${r.id}" data-op="aprobar">Aprobar</button>`:r.estado==='APROBADA'?`<button class="btn sm" data-a="rem" data-id="${r.id}" data-op="pagar">Marcar pagada</button>`:''}</span>
    <span style="text-align:right"><b>${money(r.total_liquido)}</b><br><span class="bd ${r.estado==='PAGADA'?'ok':''}">${esc(r.estado)}</span></span></div>`).join('')||'<small>Aún no hay remuneraciones</small>'}</div>`);
    $('#ok').onclick=async()=>{try{await api('/remuneraciones/',{method:'POST',body:{trabajador:$('#tr').value,periodo_inicio:$('#d1').value,periodo_fin:$('#d2').value,bonos:+$('#bo').value||0,descuentos:+$('#de').value||0}});toast('<i class="bi bi-check-circle"></i> Calculado');V.nomina()}catch(e){toast('<i class="bi bi-exclamation-triangle"></i> '+esc(e.message))}}
  }catch(e){main(`<div class="card">${offMsg(e)}</div>`)}};

if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
S.tok&&S.me?start():login();
</script>
</body>
</html>
